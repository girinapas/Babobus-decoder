<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Babobus decoder</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 32px;
    width: 100%;
    max-width: 560px;
  }
  h1 {
    margin: 0 0 24px;
    font-size: 24px;
    color: #333;
    text-align: center;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: #555;
    font-size: 14px;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border: 2px solid #ddd;
    border-radius: 8px;
    outline: none;
    transition: border-color .2s;
  }
  input[type="text"]:focus { border-color: #667eea; }
  .buttons {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }
  button {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform .1s, box-shadow .2s;
    color: #fff;
  }
  button:active { transform: scale(0.97); }
  .btn-encrypt { background: #667eea; }
  .btn-encrypt:hover { box-shadow: 0 4px 14px rgba(102,126,234,.5); }
  .btn-decrypt { background: #764ba2; }
  .btn-decrypt:hover { box-shadow: 0 4px 14px rgba(118,75,162,.5); }
  .result {
    margin-top: 20px;
    padding: 16px;
    background: #f5f5f9;
    border-radius: 8px;
    border-left: 4px solid #667eea;
    min-height: 24px;
    font-size: 18px;
    word-break: break-word;
    color: #333;
  }
  .result .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    margin-bottom: 4px;
  }
  .result .value {
    font-weight: 700;
    color: #333;
    font-family: 'Courier New', monospace;
  }
  .hint {
    margin-top: 16px;
    font-size: 12px;
    color: #999;
    text-align: center;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Cipher Tool</h1>

  <label for="input">Enter a word:</label>
  <input type="text" id="input" placeholder="e.g. babobus" autocomplete="off">

  <div class="buttons">
    <button class="btn-encrypt" onclick="doEncrypt()">Encrypt</button>
    <button class="btn-decrypt" onclick="doDecrypt()">Decrypt</button>
  </div>

  <div class="result" id="result" style="display:none;">
    <div class="label" id="resultLabel"></div>
    <div class="value" id="resultValue"></div>
  </div>

  <div class="hint">Hint: four encryptions in a row return the word to its original form</div>
</div>

<script>
  function encrypt(word) {
    const len = word.length;
    const half = Math.floor(len / 2);
    const secondHalf = len - half;

    const first  = word.slice(0, half);
    const second = word.slice(half, half + secondHalf);

    let result = '';
    for (let i = 0; i < secondHalf; i++) {
      if (i < half) {
        result += second[i];
        result += first[i];
      } else {
        result += second[i];
      }
    }
    return result;
  }

  function decrypt(cipher) {
    let first = '';
    let second = '';
    for (let i = 0; i < cipher.length; i++) {
      if (i % 2 === 0) second += cipher[i];
      else             first  += cipher[i];
    }
    return first + second;
  }

  function showResult(label, value) {
    const resultDiv = document.getElementById('result');
    document.getElementById('resultLabel').textContent = label;
    document.getElementById('resultValue').textContent = value;
    resultDiv.style.display = 'block';
  }

  function doEncrypt() {
    const word = document.getElementById('input').value.trim();
    if (!word) {
      showResult('Error', 'Please enter a word');
      return;
    }
    showResult('Encrypted word', encrypt(word));
  }

  function doDecrypt() {
    const word = document.getElementById('input').value.trim();
    if (!word) {
      showResult('Error', 'Please enter a word');
      return;
    }
    showResult('Decrypted word', decrypt(word));
  }

  document.getElementById('input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doEncrypt();
  });
</script>
</body>
</html>
